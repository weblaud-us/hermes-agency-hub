[pytest]
testpaths = tests

# `auto` so coroutine tests need no per-test marker; the suite is entirely
# async-or-trivial and opting in individually is just noise.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# --strict-markers so a typo'd marker is a collection error rather than a
# silently-never-selected test. --strict-config does the same for this file.
addopts = -q -ra --strict-markers --strict-config

markers =
    docker: needs a live Docker daemon; opt in with HERMES_TEST_DOCKER=1
    slow: takes more than a second or two

filterwarnings =
    # Our own deprecations are bugs to fix, not notices to scroll past.
    error::DeprecationWarning:src.*
    # Third-party, not actionable here: starlette's TestClient warns about its
    # own httpx dependency.
    ignore:Using .httpx. with .starlette.testclient. is deprecated
