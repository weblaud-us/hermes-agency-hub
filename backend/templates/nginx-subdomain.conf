# ---------------------------------------------------------------------------
# nginx site for {{ company_name }} — {{ subdomain }}
#
# GENERATED BY THE AGENCY HUB — DO NOT EDIT BY HAND.
# Rewritten on every re-provision and removed on teardown.
#
# Upstream mode: {{ upstream_mode }}
#   network  -> the tenant container by name over the shared Docker network
#   loopback -> the tenant's published port on the host loopback interface
# A containerized nginx must use `network`: the published ports live on the
# *host's* loopback, which is not reachable from inside the nginx container.
# ---------------------------------------------------------------------------

upstream hermes_dash_{{ slug_underscored }} {
    server {{ upstream_host }}:{{ upstream_dash_port }};
    keepalive 16;
}

upstream hermes_api_{{ slug_underscored }} {
    server {{ upstream_host }}:{{ upstream_api_port }};
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name {{ subdomain }};

    # The agent streams token-by-token and uploads attachments; neither should
    # be truncated by a proxy default.
    client_max_body_size 64m;

    access_log /var/log/nginx/{{ slug }}.access.log;
    error_log  /var/log/nginx/{{ slug }}.error.log;

    # Identifies which tenant served a response when debugging across hosts.
    add_header X-Hermes-Tenant "{{ slug }}" always;

    # ---- OpenAI-compatible API ------------------------------------------
    # Declared before `/` so it wins on prefix length. Authentication is the
    # tenant's own bearer token, checked by the agent, not by nginx.
    location /v1/ {
        proxy_pass http://hermes_api_{{ slug_underscored }};
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Streamed completions must reach the client as they are produced.
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  {{ proxy_read_timeout }}s;
        proxy_send_timeout  {{ proxy_read_timeout }}s;
        chunked_transfer_encoding on;
    }

    # ---- Web dashboard (default route) ----------------------------------
    location / {
        proxy_pass http://hermes_dash_{{ slug_underscored }};
        proxy_http_version 1.1;

        # The dashboard holds live websocket connections for session output;
        # without these two headers it falls back to failing reconnects.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout {{ proxy_read_timeout }}s;
        proxy_send_timeout {{ proxy_read_timeout }}s;
    }
}
