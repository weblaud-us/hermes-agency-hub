# ---------------------------------------------------------------------------
# Shared nginx directives for every Hermes tenant site.
#
# GENERATED BY THE AGENCY HUB — DO NOT EDIT BY HAND.
# Written once into the sites directory and kept in place for the lifetime of
# the deployment (the hub rewrites it on startup).
#
# This lands in nginx's conf.d, which is included from inside the `http` block,
# so `map` is legal here. It cannot live in a per-tenant site file: `map` is an
# http-level directive and nginx refuses it inside `server`.
#
# The filename is prefixed `00-` so it is unmistakably shared rather than a
# tenant whose subdomain happens to sort first.
# ---------------------------------------------------------------------------

# Correct websocket upgrade handling for keepalive upstreams: pass through
# "upgrade" only when the client actually asked for it, and send an empty
# Connection header otherwise. Hardcoding `Connection: upgrade` on every
# request breaks plain HTTP keepalive to the tenant dashboards.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# The dashboard's /login page is rendered by the agent image and offers no way
# to reveal the password, so nginx adds a toggle as the page passes through. It
# lives here rather than in the tenant sites because `sub_filter` is inherited by
# every location and this file is rewritten on each hub start, so tenants that
# already exist get it without re-provisioning.
#
# This fails open. If the page changes shape the script finds nothing to attach
# to, and if the agent starts compressing responses nginx cannot match `</body>`.
# Either way sign-in still works, without the toggle.
#
# Keep the value free of `$` and single quotes, and under 4096 bytes: that is
# nginx's limit for one config token, and going over fails the whole config.
map $uri $hermes_body_close {
    default '</body>';
    /login '<style>
  .hermes-reveal-wrap { position: relative; }
  .hermes-reveal-wrap .field-input { padding-right: 2.75rem; }
  .hermes-reveal-wrap input::-ms-reveal { display: none; }
  .hermes-reveal {
    position: absolute; right: 1px; bottom: 1px; width: 2.5rem; height: 2.5rem;
    display: grid; place-items: center; padding: 0;
    background: none; border: 0; cursor: pointer;
    color: color-mix(in srgb, var(--foreground) 55%, transparent);
  }
  .hermes-reveal:hover { color: var(--midground); }
  .hermes-reveal:focus-visible { outline: 2px solid var(--midground); outline-offset: -2px; }
</style>
<script>
(function () {
  document.querySelectorAll(`input[type=password]`).forEach(function (input) {
    var field = input.closest(`.field`);
    if (!field) return;
    /* Beside the label, not in it: a label may hold only one labelable control. */
    var wrap = document.createElement(`div`);
    wrap.className = `hermes-reveal-wrap`;
    field.before(wrap);
    wrap.append(field);
    var button = document.createElement(`button`);
    button.type = `button`;
    button.className = `hermes-reveal`;
    button.innerHTML = `<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/><path class="hermes-slash" d="m2 2 20 20"/></svg>`;
    var slash = button.querySelector(`.hermes-slash`);
    function show(on) {
      input.type = on ? `text` : `password`;
      button.setAttribute(`aria-label`, on ? `Hide password` : `Show password`);
      slash.style.display = on ? `` : `none`;
    }
    show(false);
    /* Revealed text must not go to a browser spellcheck service. */
    input.spellcheck = false;
    button.addEventListener(`click`, function () { show(input.type === `password`); });
    input.form.addEventListener(`submit`, function () { show(false); });
    wrap.append(button);
  });
})();
</script>
</body>';
}
sub_filter '</body>' $hermes_body_close;

# Tenants are reached by Host header. A request arriving with an unknown or
# absent Host matches this catch-all instead of silently landing on whichever
# tenant site nginx loaded first.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}
