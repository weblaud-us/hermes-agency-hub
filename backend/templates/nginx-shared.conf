# ---------------------------------------------------------------------------
# Shared nginx directives for every Hermes tenant site.
#
# GENERATED BY THE AGENCY HUB — DO NOT EDIT BY HAND.
# Written once into the sites directory and kept in place for the lifetime of
# the deployment (the hub rewrites it on startup).
#
# This lands in nginx's conf.d, which is included from inside the `http` block,
# so `map` is legal here. It cannot live in a per-tenant site file: `map` is an
# http-level directive and nginx refuses it inside `server`.
#
# The filename is prefixed `00-` so it is unmistakably shared rather than a
# tenant whose subdomain happens to sort first.
# ---------------------------------------------------------------------------

# Correct websocket upgrade handling for keepalive upstreams: pass through
# "upgrade" only when the client actually asked for it, and send an empty
# Connection header otherwise. Hardcoding `Connection: upgrade` on every
# request breaks plain HTTP keepalive to the tenant dashboards.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Tenants are reached by Host header. A request arriving with an unknown or
# absent Host matches this catch-all instead of silently landing on whichever
# tenant site nginx loaded first.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}
