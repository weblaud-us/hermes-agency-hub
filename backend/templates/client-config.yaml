# ---------------------------------------------------------------------------
# Hermes Agent config for {{ company_name }} ({{ subdomain }})
#
# GENERATED BY THE AGENCY HUB — DO NOT EDIT BY HAND.
# Rewritten on every re-provision; manual edits are lost.
#
# This file is deliberately MINIMAL and additive. The image ships a large
# canonical config template and seeds it only when no config.yaml exists, so
# anything the hub writes here replaces that seed. Everything omitted below
# therefore falls back to the image's own defaults, which is what we want —
# the hub has no business pinning the agent's hundreds of tuning knobs.
#
# Note there is no `_config_version` stamp: the image's boot-time migrator
# treats an unstamped config as "seeded from template" and stamps/migrates it
# up to the current schema, so this file stays correct across image upgrades.
#
# Operational precedence: the sibling .env wins over this file for every key
# it sets (the agent loads it with override=True). The credentials below are
# the recommended at-rest form, duplicated from .env so that a tenant whose
# .env is rotated by hand still has a coherent config. Secrets only; no
# plaintext password appears in either file.
# ---------------------------------------------------------------------------

dashboard:
  basic_auth:
    username: "{{ dashboard_username }}"
    # scrypt$n$r$p$<salt>$<dk> — verified by the image's bundled basic-auth
    # provider. The plaintext was shown to the operator once and is stored
    # nowhere.
    password_hash: "{{ dashboard_password_hash }}"
    # Stable session-signing key; without it logins die on every restart.
    secret: "{{ dashboard_secret }}"
    session_ttl_seconds: {{ dashboard_session_ttl_seconds }}

# ---- Agency metadata (informational) --------------------------------------
# Not read by the agent. Present so an operator opening a shell in the
# container can identify the tenant and its control plane.
#
#   client_slug:  {{ slug }}
#   company_name: {{ company_name }}
#   subdomain:    {{ subdomain }}
#   plan:         {{ plan }}
#   public_url:   {{ public_url }}
#   hub_url:      {{ hub_url }}
#   environment:  {{ environment }}
#   skills:       {{ skills | join(', ') if skills else '(all shared skills)' }}
